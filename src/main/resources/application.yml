server:
  port: ${PORT:8089}

spring:
  application:
    name: ${SPRING_APP_NAME:Ciclo-vida}

  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    
# Propiedades personalizadas
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
          jwk-set-uri: ${JWT_JWK_SET_URI}
